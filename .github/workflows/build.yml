name: Build

# Staged Linux-only implementation: main keeps legacy publishing until the
# ordered compatible CLI release and installed-boot gate is satisfied.
on:
  workflow_call: {}
  pull_request:
    paths: [flake.nix, flake.lock, images/**, kernel/**, qemu-wasm/**, packaging/**, scripts/**, .github/workflows/build.yml]
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, images/**, kernel/**, qemu-wasm/**, packaging/**, scripts/**, .github/workflows/build.yml]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-layer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Restore the Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ matrix.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'flake.nix', 'images/**', 'kernel/**') }}
          restore-prefixes-first-match: nix-${{ matrix.arch }}-${{ github.job }}-
          gc-max-store-size: 2G
      - name: Build and stage builder, both workload profiles and default dev
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SYSTEM="${ARCH}-linux"
          format=elf
          if [[ "$ARCH" == aarch64 ]]; then format=image; fi
          mkdir -p staging
          builder=$(nix build ".#legacyPackages.${SYSTEM}.builder-vm.default" --no-link --print-out-paths)
          cp -L "$builder/vmlinux" "staging/builder-vm-vmlinux-${ARCH}"
          cp -L "$builder/kernel.config" "staging/builder-vm-${ARCH}.kernel.config"
          cp -L "$builder/rootfs.ext4" "staging/builder-vm-rootfs-${ARCH}.ext4"
          python3 scripts/check_linux_layer.py --arch "$ARCH" --kernel "$builder/vmlinux" \
            --format "$format" --rootfs "$builder/rootfs.ext4" --profile builder --kernel-config "$builder/kernel.config"
          for profile in default rootless; do
            image=$(nix build ".#legacyPackages.${SYSTEM}.${profile}-tenant.default" --no-link --print-out-paths)
            cp -L "$image/vmlinux" "staging/${profile}-microvm-vmlinux-${ARCH}"
            for suffix in ext4 verity roothash; do
              cp -L "$image/rootfs.$suffix" "staging/${profile}-microvm-rootfs-${ARCH}.$suffix"
            done
            python3 scripts/check_linux_layer.py --arch "$ARCH" --kernel "$image/vmlinux" \
              --format "$format" --rootfs "$image/rootfs.ext4" --profile "${profile}-tenant"
          done
          dev=$(nix build ".#legacyPackages.${SYSTEM}.default-tenant.dev" --no-link --print-out-paths)
          cp -L "$dev/vmlinux" "staging/default-microvm-dev-vmlinux-${ARCH}"
          cp -L "$dev/rootfs.ext4" "staging/default-microvm-dev-rootfs-${ARCH}.ext4"
          cp -L "$dev/mvm-meta.json" "staging/default-microvm-dev-meta-${ARCH}.json"
          python3 scripts/check_linux_layer.py --arch "$ARCH" --kernel "$dev/vmlinux" \
            --format "$format" --rootfs "$dev/rootfs.ext4"
          rootless_dev=$(nix build ".#legacyPackages.${SYSTEM}.rootless-tenant.dev" --no-link --print-out-paths)
          python3 scripts/check_linux_layer.py --arch "$ARCH" --kernel "$rootless_dev/vmlinux" \
            --format "$format" --rootfs "$rootless_dev/rootfs.ext4" --profile rootless-tenant
      - name: Boot every native published workload root with the contract probe
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get update
          if [[ "$ARCH" == aarch64 ]]; then
            sudo apt-get install -y qemu-system-arm
          else
            sudo apt-get install -y qemu-system-x86
          fi
          sudo modprobe vhost_vsock
          sudo chmod a+rw /dev/vhost-vsock
          probe=$(nix build ".#checks.${ARCH}-linux.base-contract-probe" --no-link --print-out-paths)
          mkdir -p diagnostics
          cp -L "$probe/base-contract-probe-${ARCH}.cpio.gz" diagnostics/
          python3 scripts/boot-base-contract.py --artifacts staging --arch "$ARCH" \
            --probe "${ARCH}=diagnostics/base-contract-probe-${ARCH}.cpio.gz" \
            --expected-contract 1 --accel tcg \
            --witness "diagnostics/base-contract-${ARCH}.json"
      - name: Upload test-only contract probe and boot diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-contract-probe-${{ matrix.arch }}
          if-no-files-found: ignore
          path: diagnostics/
      - name: Build builder and workload kernels with local format and budget checks
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-kernel-artifacts.sh "$ARCH"
      - name: Boot the rootless capability probe directly in QEMU
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          sudo modprobe vhost_vsock
          sudo chmod a+rw /dev/vhost-vsock
          smoke=$(nix build ".#legacyPackages.x86_64-linux.rootless-tenant.smoke" --no-link --print-out-paths)
          ./scripts/e2e_boot.py qemu "$smoke" \
            --accel tcg --rootfs-name rootfs.ext4 --rootfs-type ext4 \
            --init /usr/local/bin/mvm-rootless-probe \
            --ready-marker MVM-ROOTLESS-READY --timeout 180
      - name: Upload the completed Linux-layer members
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-layer-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            staging/builder-vm-vmlinux-${{ matrix.arch }}
            staging/builder-vm-${{ matrix.arch }}.kernel.config
            staging/builder-vm-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-vmlinux-${{ matrix.arch }}
            staging/default-microvm-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-rootfs-${{ matrix.arch }}.verity
            staging/default-microvm-rootfs-${{ matrix.arch }}.roothash
            staging/rootless-microvm-vmlinux-${{ matrix.arch }}
            staging/rootless-microvm-rootfs-${{ matrix.arch }}.ext4
            staging/rootless-microvm-rootfs-${{ matrix.arch }}.verity
            staging/rootless-microvm-rootfs-${{ matrix.arch }}.roothash
            staging/default-microvm-dev-vmlinux-${{ matrix.arch }}
            staging/default-microvm-dev-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-dev-meta-${{ matrix.arch }}.json
            staging/vmlinux-${{ matrix.arch }}-builder
      - name: Upload kernel diagnostics even after a budget failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-diagnostics-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            staging/kernel-${{ matrix.arch }}.json
            staging/kernel-metrics-${{ matrix.arch }}.json
            staging/rootless-kernel-metrics-${{ matrix.arch }}.json
            staging/builder-config-${{ matrix.arch }}
            staging/workload-config-${{ matrix.arch }}
            staging/rootless-config-${{ matrix.arch }}

  qemu-wasm-site-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Restore the Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-x86_64-${{ github.job }}-${{ hashFiles('flake.lock', 'flake.nix', 'images/**', 'kernel/**', 'qemu-wasm/**') }}
          restore-prefixes-first-match: nix-x86_64-${{ github.job }}-
          gc-max-store-size: 2G
      - name: Build the generic browser smoke pack
        run: |
          set -euo pipefail
          pack=$(nix build ".#legacyPackages.x86_64-linux.qemu-wasm.qemu-wasm-smoke-pack" --no-link --print-out-paths)
          printf 'QEMU_WASM_STORE_PATH=%s\n' "$pack" >> "$GITHUB_ENV"
          mkdir -p staging
          tar -C "$pack" -czf staging/qemu-wasm-smoke-pack.tar.gz .
      - name: Boot the pack directly in Chromium
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome"
          ./scripts/run-qemu-wasm-smoke-chromium.py "$QEMU_WASM_STORE_PATH" "$chrome"
      - name: Upload the browser pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-wasm-site-pack
          if-no-files-found: error
          path: staging/qemu-wasm-smoke-pack.tar.gz
