# THROWAWAY external validation for tinylabscom/mvm#3599: run the
# clone()-in-a-fresh-pid-ns repro on GitHub's Ubuntu aarch64 runners (real
# KVM), fully outside the developer machine where every kernel so far —
# including a Debian distro kernel — fails the repro. Userspace (busybox,
# k3s) is fetched pristine from upstream releases to also exclude
# builder-VM-built rootfs binaries as the cause. Delete with the bisect.
name: clone-repro-external
on:
  push:
    branches: [feat/datapath-kernel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm cpio xz-utils e2fsprogs wget
      - name: fetch pristine userspace
        run: |
          mkdir -p /tmp/ir/bin /tmp/ir/mods /tmp/ir/proc /tmp/ir/sys /tmp/ir/newroot /tmp/ir/dev \
                   /tmp/rfs/bin /tmp/rfs/usr/local/bin /tmp/rfs/lib/aarch64-linux-gnu \
                   /tmp/rfs/proc /tmp/rfs/sys /tmp/rfs/dev
          # Debian static busybox (upstream binary, never touched by our builders)
          cd /tmp
          wget -q "http://ftp.debian.org/debian/pool/main/b/busybox/busybox-static_1.38.0-3+b1_arm64.deb" -O /tmp/bb.deb
          ar x /tmp/bb.deb data.tar.xz && tar xf data.tar.xz ./usr/bin/busybox
          cp usr/bin/busybox /tmp/ir/bin/busybox
          cp usr/bin/busybox /tmp/rfs/bin/busybox
          for a in sh mount unshare echo poweroff true cat ls; do
            ln -sf busybox "/tmp/rfs/bin/$a"
          done
          # same k3s version as the template, upstream release binary
          wget -q "https://github.com/k3s-io/k3s/releases/download/v1.34.5%2Bk3s1/k3s-arm64" -O /tmp/rfs/usr/local/bin/k3s
          chmod +x /tmp/rfs/usr/local/bin/k3s
          # k3s is dynamically linked: stage the aarch64 glibc loader + libs
          cp /lib/ld-linux-aarch64.so.1 /tmp/rfs/lib/
          for l in libc.so.6 libresolv.so.2 libnss_dns.so.2 libnss_files.so.2 libz.so.1; do
            cp "/lib/aarch64-linux-gnu/$l" /tmp/rfs/lib/aarch64-linux-gnu/ 2>/dev/null || true
          done
      - name: build rootfs
        run: |
          mke2fs -t ext4 -q -F -d /tmp/rfs /tmp/rootfs.ext4 512M
      - name: build initramfs
        run: |
          cp repro/init /tmp/ir/init
          chmod +x /tmp/ir/init
          python3 repro/build-initramfs.py /tmp/ir /tmp/probe-initramfs.cpio.gz
      - name: matrix
        timeout-minutes: 40
        run: |
          set -u
          mkdir -p /tmp/logs
          run_case() {
            name="$1"; kernel="$2"; acc="$3"; cpu="$4"
            log="/tmp/logs/${name}.log"
            timeout 120 qemu-system-aarch64 \
              -machine virt,accel="$acc" -cpu "$cpu" -smp 2 -m 2048 \
              -kernel "$kernel" -initrd /tmp/probe-initramfs.cpio.gz \
              -append "console=ttyAMA0 rdinit=/init panic=-1" \
              -drive file=/tmp/rootfs.ext4,format=raw,if=virtio,snapshot=on \
              -nographic -no-reboot > "$log" 2>&1 || true
            if grep -q "Out of memory\|newosproc" "$log"; then verdict="REPRODUCES-BUG"; \
            elif grep -q "STORM_DONE" "$log" && grep -q "k3s version" "$log"; then verdict="PASSES"; \
            else verdict="INCONCLUSIVE"; fi
            echo "${name}: ${verdict}"
          }
          run_case mvm-rootless-kvm-host repro/vmlinux-rootless kvm host
          run_case mvm-rootless-tcg-max  repro/vmlinux-rootless tcg max
          run_case mvm-rootless-tcg-a57  repro/vmlinux-rootless tcg cortex-a57
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clone-repro-logs
          path: /tmp/logs
          retention-days: 14
