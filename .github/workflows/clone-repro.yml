# THROWAWAY external validation for tinylabscom/mvm#3599: run the
# clone()-in-a-fresh-pid-ns repro on GitHub's Ubuntu aarch64 runners (real
# KVM), fully outside the developer machine where every kernel so far —
# including a Debian distro kernel — fails the repro. Userspace (busybox,
# k3s) is fetched pristine from upstream releases to also exclude
# builder-VM-built rootfs binaries as the cause. Delete with the bisect.
name: clone-repro-external
on:
  push:
    branches: [feat/datapath-kernel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install qemu + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm cpio xz-utils e2fsprogs wget
      - name: fetch pristine userspace
        run: |
          mkdir -p /tmp/ir/bin /tmp/ir/mods /tmp/ir/proc /tmp/ir/sys /tmp/ir/newroot /tmp/ir/dev \
                   /tmp/rfs/bin /tmp/rfs/usr/local/bin /tmp/rfs/lib/aarch64-linux-gnu \
                   /tmp/rfs/proc /tmp/rfs/sys /tmp/rfs/dev
          # Debian static busybox (upstream binary, never touched by our builders)
          cd /tmp
          wget -q "http://ftp.debian.org/debian/pool/main/b/busybox/busybox-static_1.38.0-3+b1_arm64.deb" -O /tmp/bb.deb
          ar x /tmp/bb.deb data.tar.xz && tar xf data.tar.xz ./usr/bin/busybox
          cp usr/bin/busybox /tmp/ir/bin/busybox
          cp usr/bin/busybox /tmp/rfs/bin/busybox
          for a in sh mount unshare echo poweroff true cat ls; do
            ln -sf busybox "/tmp/rfs/bin/$a"
          done
          # same k3s version as the template, upstream release binary
          wget -q "https://github.com/k3s-io/k3s/releases/download/v1.34.5%2Bk3s1/k3s-arm64" -O /tmp/rfs/usr/local/bin/k3s
          chmod +x /tmp/rfs/usr/local/bin/k3s
          # k3s is dynamically linked: stage the aarch64 glibc loader + libs
          cp /lib/ld-linux-aarch64.so.1 /tmp/rfs/lib/
          for l in libc.so.6 libresolv.so.2 libnss_dns.so.2 libnss_files.so.2 libz.so.1; do
            cp "/lib/aarch64-linux-gnu/$l" /tmp/rfs/lib/aarch64-linux-gnu/ 2>/dev/null || true
          done
      - name: build rootfs
        run: |
          mke2fs -t ext4 -q -F -d /tmp/rfs /tmp/rootfs.ext4 512M
          # Debian 6.18.15 control kernel (extract vmlinuz + ext4/virtio modules)
          wget -q "http://ftp.debian.org/debian/pool/main/l/linux/linux-image-6.18.15+deb13-arm64-unsigned_6.18.15-1~bpo13+1_arm64.deb" -O /tmp/k.deb
          cd /tmp && ar x k.deb data.tar.xz && tar xf data.tar.xz ./usr/lib/modules/6.18.15+deb13-arm64/kernel/drivers/block/virtio_blk.ko.xz ./usr/lib/modules/6.18.15+deb13-arm64/kernel/fs/ext4/ext4.ko.xz ./usr/lib/modules/6.18.15+deb13-arm64/kernel/fs/jbd2/jbd2.ko.xz ./usr/lib/modules/6.18.15+deb13-arm64/kernel/fs/mbcache.ko.xz ./usr/lib/modules/6.18.15+deb13-arm64/kernel/lib/crc/crc16.ko.xz ./boot/vmlinuz-6.18.15+deb13-arm64
          cp boot/vmlinuz-6.18.15+deb13-arm64 /tmp/deb-vmlinuz
          # modules must be uncompressed .ko for busybox insmod
          mkdir -p /tmp/ir/mods
          for m in virtio virtio_ring virtio_pci_modern_dev virtio_pci_legacy_dev virtio_pci virtio_blk ext4 jbd2 mbcache crc16; do
            src=$(find usr/lib/modules lib/modules -name "$m.ko*" 2>/dev/null | head -1)
            [ -n "$src" ] || continue
            xz -dc "$src" > "/tmp/ir/mods/$m.ko"
          done
          # Debian 6.1 (bookworm) — the version fork: does an old LTS pass?
          wget -q "https://snapshot.debian.org/archive/debian-security/20260908T092208Z/pool/updates/main/l/linux/linux-image-6.1.0-52-arm64-unsigned_6.1.180-1_arm64.deb" -O /tmp/k61.deb
          cd /tmp && mkdir -p k61 && cd k61 && ar x /tmp/k61.deb data.tar.xz && tar xf data.tar.xz
          cp boot/vmlinuz-6.1.0-52-arm64 /tmp/deb61-vmlinuz
          mkdir -p /tmp/ir61/mods
          for m in virtio virtio_ring virtio_pci_modern_dev virtio_pci_legacy_dev virtio_pci virtio_blk ext4 jbd2 mbcache crc16; do
            src=$(find . -path "*lib/modules*" -name "$m.ko*" 2>/dev/null | head -1)
            [ -n "$src" ] || continue
            case "$src" in
              *.xz) xz -dc "$src" > "/tmp/ir61/mods/$m.ko" ;;
              *.zst) zstd -dc "$src" > "/tmp/ir61/mods/$m.ko" ;;
              *) cp "$src" "/tmp/ir61/mods/$m.ko" ;;
            esac
          done
          cd /tmp
      - name: build initramfs
        run: |
          cp repro/init /tmp/ir/init
          chmod +x /tmp/ir/init
          python3 repro/build-initramfs.py /tmp/ir /tmp/probe-deb18.cpio.gz
          cp repro/init /tmp/ir61/init
          chmod +x /tmp/ir61/init
          mkdir -p /tmp/ir61/bin /tmp/ir61/proc /tmp/ir61/sys /tmp/ir61/newroot /tmp/ir61/dev
          cp /tmp/ir/bin/busybox /tmp/ir61/bin/busybox
          python3 repro/build-initramfs.py /tmp/ir61 /tmp/probe-deb61.cpio.gz
          # mvm kernels carry the drivers built-in: an empty-mods initramfs
          mkdir -p /tmp/irmvm/bin /tmp/irmvm/mods /tmp/irmvm/proc /tmp/irmvm/sys /tmp/irmvm/newroot /tmp/irmvm/dev
          cp /tmp/ir/bin/busybox /tmp/irmvm/bin/busybox
          cp repro/init /tmp/irmvm/init
          chmod +x /tmp/irmvm/init
          python3 repro/build-initramfs.py /tmp/irmvm /tmp/probe-mvm.cpio.gz
      - name: matrix
        timeout-minutes: 40
        run: |
          set -u
          mkdir -p /tmp/logs
          run_case() {
            name="$1"; kernel="$2"; acc="$3"; cpu="$4"; extra="${5:-}"; smp="${6:-2}"; initrd="${7:-/tmp/probe-mvm.cpio.gz}"
            log="/tmp/logs/${name}.log"
            timeout 120 qemu-system-aarch64 \
              $extra -machine virt,accel="$acc" -cpu "$cpu" -smp "$smp" -m 2048 \
              -kernel "$kernel" -initrd "$initrd" \
              -append "console=ttyAMA0 rdinit=/init panic=-1" \
              -drive file=/tmp/rootfs.ext4,format=raw,if=virtio,snapshot=on \
              -nographic -no-reboot > "$log" 2>&1 || true
            if grep -q "Out of memory\|newosproc" "$log"; then verdict="REPRODUCES-BUG"; \
            elif grep -q "STORM_DONE" "$log" && grep -q "k3s version" "$log"; then verdict="PASSES"; \
            else verdict="INCONCLUSIVE"; fi
            echo "${name}: ${verdict}"
          }
          run_case mvm-rootless-tcg-max   repro/vmlinux-rootless tcg max
          run_case mvm-rootless-tcg-a57   repro/vmlinux-rootless tcg cortex-a57
          run_case mvm-rootless-tcg-gic2  repro/vmlinux-rootless tcg max "-machine virt,gic-version=2" 2
          run_case mvm-rootless-tcg-smp1  repro/vmlinux-rootless tcg max "" 1
          run_case mvm-rootless-tcg-oldm  repro/vmlinux-rootless tcg max "-machine virt-6.0" 2
          run_case debian-kernel-tcg      /tmp/deb-vmlinuz tcg max "" 2 /tmp/probe-deb18.cpio.gz
          run_case debian-6.1-tcg         /tmp/deb61-vmlinuz tcg max "" 2 /tmp/probe-deb61.cpio.gz
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clone-repro-logs
          path: /tmp/logs
          retention-days: 14
