name: Image-owned CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  image-nix-checks:
    name: Image Nix checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Install just (command runner)
        run: |
          set -euo pipefail
          # Install Rust toolchain and compile `just` so we have a known-good binary
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install --locked just
      - name: Build image derivations (fast subset)
        run: |
          set -euo pipefail
          # Build the runtime overlay and default-tenant derivations (x86_64)
          just build runtime-overlay default
          # Also build the qemu-wasm smoke pack (produces kernel.img + rootfs.bin) on x86_64
          arch=$(uname -m)
          if [ "$arch" = "x86_64" ] || [ "$arch" = "amd64" ]; then
            just build qemu-wasm qemu-wasm-smoke-pack
            # Locate the nix store result(s) and copy expected artifacts into ./result
            system=$(uname -m | sed -e 's/^arm64$/aarch64/' -e 's/^amd64$/x86_64/')-linux
            echo "system=$system"
            STORE="$(nix build ".#legacyPackages.${system}.qemu-wasm.qemu-wasm-smoke-pack" --no-link --print-out-paths | head -n1)"
            echo "STORE=$STORE"
            # Ensure ./result is a writable directory (nix build may create a symlink)
            if [ -L result ] || [ -e result ]; then rm -rf result; fi
            mkdir -p result
            # Recursively find and copy common kernel/rootfs artifact names into a clean result/
            find "$STORE" -maxdepth 6 -type f \( -name 'kernel.img' -o -name 'vmlinux' -o -name 'rootfs.bin' -o -name 'rootfs.ext4' \) -exec cp -L {} result/ \; || true
          fi
      - name: Run image tests (QEMU smoke)
        run: |
          set -euo pipefail
          # The repo exposes a qemu smoke harness; run the smoke for x86_64
          just bdd
      - name: Upload build result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-result
          path: result

  boot-witness-qemu:
    name: Boot witness (QEMU)
    runs-on: ubuntu-latest
    needs: image-nix-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download build result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-result
          path: ./result
      - name: Ensure Python available
        run: |
          set -euo pipefail
          python3 --version || (sudo apt-get update && sudo apt-get install -y python3)
      - name: Install QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Run QEMU boot witness (TCG)
        run: |
          set -euo pipefail
          python3 scripts/e2e_boot.py qemu ./result --binary qemu-system-x86_64 --accel tcg
      - name: Upload witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-boot-witness
          path: /tmp/qemu-boot-witness.json
