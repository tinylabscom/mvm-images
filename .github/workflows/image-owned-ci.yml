name: Image-owned CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  image-nix-checks:
    name: Image Nix checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Install just (command runner)
        run: |
          set -euo pipefail
          # Install Rust toolchain and compile `just` so we have a known-good binary
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cargo install --locked just
      - name: Build image derivations (fast subset)
        run: |
          set -euo pipefail
          # Build the runtime overlay and default-tenant derivations (x86_64)
          just build runtime-overlay default
          # Also build the qemu-wasm smoke pack (produces kernel.img + rootfs.bin) on x86_64
          arch=$(uname -m)
          if [ "$arch" = "x86_64" ] || [ "$arch" = "amd64" ]; then
            just build qemu-wasm qemu-wasm-smoke-pack
            # Locate the nix store result(s) and copy expected artifacts into ./result
            system=$(uname -m | sed -e 's/^arm64$/aarch64/' -e 's/^amd64$/x86_64/')-linux
            echo "system=$system"
            STORE="$(nix build ".#legacyPackages.${system}.qemu-wasm.qemu-wasm-smoke-pack" --no-link --print-out-paths | head -n1)"
            echo "STORE=$STORE"
            # Ensure ./result is a writable directory (nix build may create a symlink or root-owned files)
            if [ -L result ] || [ -e result ]; then sudo rm -rf result; fi
            mkdir -p result
            # Make sure result is writable by the runner
            sudo chown -R "$(id -u):$(id -g)" result || true
            chmod -R u+rwX result || true
            # Recursively find and copy common kernel/rootfs artifact names into a clean result/
            find "$STORE" -maxdepth 6 -type f \( -name 'kernel.img' -o -name 'vmlinux' -o -name 'rootfs.bin' -o -name 'rootfs.ext4' \) -exec sudo cp -L {} result/ \; || true
          fi
      - name: Run image tests (QEMU smoke)
        run: |
          set -euo pipefail
          # The repo exposes a qemu smoke harness; run the smoke for x86_64
          just bdd
      - name: Upload build result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-result
          path: result

  boot-witness-qemu:
    name: Boot witness (QEMU)
    runs-on: ubuntu-latest
    needs: image-nix-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download build result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-result
          path: ./result
      - name: Ensure Python available
        run: |
          set -euo pipefail
          python3 --version || (sudo apt-get update && sudo apt-get install -y python3)
      - name: Install QEMU
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Run QEMU boot witness (TCG)
        run: |
          set -euo pipefail
          python3 scripts/e2e_boot.py qemu ./result --binary qemu-system-x86_64 --accel tcg
      - name: Upload witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qemu-boot-witness
          path: /tmp/qemu-boot-witness.json

  boot-witness-firecracker:
    name: Boot witness (Firecracker)
    runs-on: ubuntu-latest
    needs: image-nix-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download build result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-result
          path: ./result
      - name: Install Firecracker
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) fc_arch=x86_64 ;;
            aarch64|arm64) fc_arch=aarch64 ;;
            *) fc_arch=x86_64 ;;
          esac
          tmpdir=$(mktemp -d)
          curl -fSL "https://github.com/firecracker-microvm/firecracker/releases/latest/download/firecracker-${fc_arch}.tgz" -o "$tmpdir/firecracker.tgz" || true
          if [ -f "$tmpdir/firecracker.tgz" ]; then
            tar -xzf "$tmpdir/firecracker.tgz" -C "$tmpdir"
            sudo install -m0755 "$tmpdir/firecracker" /usr/local/bin/firecracker || true
          else
            echo "warning: could not download Firecracker prebuilt; proceeding to check /usr/local/bin/firecracker"
          fi
      - name: Run Firecracker boot witness (if KVM present)
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm not available on this runner; skipping Firecracker boot witness"
            exit 0
          fi
          firecracker_bin="$(command -v firecracker || printf '%s\n' /usr/local/bin/firecracker)"
          python3 scripts/e2e_boot.py firecracker ./result --binary "$firecracker_bin"
      - name: Upload firecracker witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firecracker-boot-witness
          path: /tmp/firecracker-boot-witness.json

  boot-witness-macos:
    name: Boot witness (macOS)
    runs-on: macos-latest
    needs: image-nix-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download build result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: image-result
          path: ./result
      - name: Install QEMU on macOS
        run: |
          set -euo pipefail
          brew update || true
          brew install qemu || true
      - name: Run QEMU boot witness on macOS (TCG)
        run: |
          set -euo pipefail
          python3 scripts/e2e_boot.py qemu ./result --binary qemu-system-x86_64 --accel tcg
      - name: Upload macOS witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-boot-witness
          path: /tmp/macos-boot-witness.json
