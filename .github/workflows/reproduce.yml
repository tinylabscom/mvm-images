name: Reproduce

# Same-commit equivalence. For the builder VM and the default microVM, on both
# guest architectures, build the image from mvm's own in-tree image flake at
# the commit flake.lock pins and from this repository, on the same runner, and
# compare derivation paths, every output file's digest, and a `--rebuild` of the
# final derivation. The staged outputs are uploaded so the same bytes can be
# booted. Publishes nothing.

on:
  pull_request:
    paths:
      - .github/workflows/reproduce.yml
      - scripts/compare-same-commit.sh
      - flake.nix
      - flake.lock
      - kernel/**
      - images/default-tenant/**
      - images/rootless-tenant/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  same-commit:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        role: [builder-vm, default-tenant]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install the pinned zig and cargo-zigbuild
        if: ${{ matrix.role == 'builder-vm' }}
        run: ./scripts/install-host-toolchain.sh
      - name: Check out mvm at the pinned commit (and build the host binaries)
        env:
          ARCH: ${{ matrix.arch }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          if [ "$ROLE" = builder-vm ]; then
            ./scripts/build-host-binaries.sh "$ARCH" "$RUNNER_TEMP/mvm"
          else
            . scripts/mvm-source.sh
            work="$RUNNER_TEMP/mvm"
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" remote add origin "$(mvm_repo_url)"
            git -C "$work" fetch -q --depth 1 origin "$(mvm_rev)"
            git -C "$work" checkout -q --detach FETCH_HEAD
          fi
      - name: Build both ways and compare
        env:
          ARCH: ${{ matrix.arch }}
          ROLE: ${{ matrix.role }}
        run: ./scripts/compare-same-commit.sh "$ARCH" "$ROLE" "$RUNNER_TEMP/mvm" "$RUNNER_TEMP/compare"
      - name: Upload comparison and staged images
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: same-commit-${{ matrix.role }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/compare

  rootless-rebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Rebuild the sealed rootless image byte-for-byte
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ref=".#legacyPackages.${ARCH}-linux.rootless-tenant.default"
          out=$(nix build "$ref" --impure --no-link --print-out-paths | head -1)
          mkdir -p "$RUNNER_TEMP/rootless-rebuild"
          (cd "$out" && find -L . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/rootless-rebuild/rootless-${ARCH}.sha256"
          nix build "$ref" --impure --no-link --rebuild -L
      - name: Upload rootless reproducibility witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootless-rebuild-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rootless-rebuild
