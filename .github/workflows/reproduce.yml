name: Reproduce

# Canonical image reproducibility. Every base role is built from this
# repository, then its final derivation is rebuilt on the same architecture.
# Nix fails the job if the registered and rebuilt bytes differ. There is no
# comparison with mvm's retired in-tree image recipes: mvm-images owns image
# composition, and mvm consumes the published digest-pinned results.

on:
  pull_request:
    paths:
      - .github/workflows/reproduce.yml
      - scripts/check-reproducible.sh
      - scripts/build-host-binaries.sh
      - scripts/install-host-toolchain.sh
      - flake.nix
      - flake.lock
      - kernel/**
      - images/builder-vm/**
      - images/default-tenant/**
      - images/rootless-tenant/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canonical-rebuild:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        role: [builder-vm, default-tenant, rootless-tenant]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Install the pinned zig and cargo-zigbuild
        if: ${{ matrix.role == 'builder-vm' }}
        run: ./scripts/install-host-toolchain.sh
      - name: Build pinned builder inputs
        if: ${{ matrix.role == 'builder-vm' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-host-binaries.sh "$ARCH" "$RUNNER_TEMP/mvm"
      - name: Rebuild the canonical image byte-for-byte
        env:
          ARCH: ${{ matrix.arch }}
          ROLE: ${{ matrix.role }}
        run: ./scripts/check-reproducible.sh "$ARCH" "$ROLE" "$RUNNER_TEMP/rebuild"
      - name: Upload reproducibility witness and boot artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-rebuild-${{ matrix.role }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rebuild
