name: Release image set

# A release tag is a request to build a candidate, not permission to publish a
# partial result. Build and byte-for-byte reproduction must finish every
# architecture and base role before entering the protected image-release environment.
# Assembly then refuses missing bytes, and an authenticated released verifier independently
# checks the signed manifest, current-train completeness, lock and artifact
# digests before `gh release create` is allowed to run. Only a verified set is
# given a build-provenance attestation, and only an attested set is published.
on:
  push:
    tags:
      - image-set/v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  reproduce:
    uses: ./.github/workflows/reproduce.yml
    permissions:
      contents: read

  publish:
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: image-release
    permissions:
      contents: write
      actions: read
      # Sigstore keyless OIDC, for both the cosign signatures and the
      # build-provenance attestation.
      id-token: write
      # Store the build-provenance attestation in this repository.
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a release commit outside main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::release tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          }
      - name: Download every completed build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: linux-layer-*
          merge-multiple: true
      - name: Download the completed browser pack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-wasm-site-pack
          path: release-assets
      - name: Download architecture-matched test probes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: base-contract-probe-*
          path: ${{ runner.temp }}/base-contract-probes
          merge-multiple: true
      - name: Install pinned Nix and cosign
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Install the pinned cosign tool
        run: |
          set -euo pipefail
          nixpkgs_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          nix profile install "github:NixOS/nixpkgs/${nixpkgs_rev}#cosign"
      - name: Install pinned ext4 inspection tools
        run: |
          set -euo pipefail
          nixpkgs_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          tools=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/${nixpkgs_rev}#e2fsprogs")
          test -x "$tools/bin/debugfs"
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Install pinned direct-VMM probe tools
        run: |
          set -euo pipefail
          nixpkgs_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          tools=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/${nixpkgs_rev}#qemu")
          test -x "$tools/bin/qemu-system-x86_64"
          test -x "$tools/bin/qemu-system-aarch64"
          echo "$tools/bin" >> "$GITHUB_PATH"
          # Contract boots require vsock; an unavailable device is a refusal,
          # never a NIC fallback or a successful skipped witness.
          sudo modprobe vhost_vsock
          sudo chmod a+rw /dev/vhost-vsock
      # The assembler also writes the build-provenance subjects: every member
      # artifact, pack manifest and SBOM, and image-set.json. It writes them
      # outside release-assets; publication uses it as the asset allowlist.
      - name: Assemble the complete image set
        id: assemble
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          subjects="$RUNNER_TEMP/provenance-subjects.sha256"
          scripts/assemble-release.py \
            --artifacts release-assets \
            --tag "$TAG" \
            --source-commit "$source_commit" \
            --issued-at "$issued_at" \
            --subjects "$subjects"
          printf 'subjects=%s\n' "$subjects" >> "$GITHUB_OUTPUT"
      - name: Boot every candidate workload root and witness its declared marker
        run: |
          set -euo pipefail
          python3 scripts/boot-base-contract.py \
            --manifest release-assets/image-set.json --artifacts release-assets \
            --probe "x86_64=$RUNNER_TEMP/base-contract-probes/base-contract-probe-x86_64.cpio.gz" \
            --probe "aarch64=$RUNNER_TEMP/base-contract-probes/base-contract-probe-aarch64.cpio.gz" \
            --accel tcg --witness "$RUNNER_TEMP/base-contract-boot-witness.json"
      - name: Upload candidate contract witness as diagnostic evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-base-contract-boot-witness
          path: ${{ runner.temp }}/base-contract-boot-witness.json
          if-no-files-found: error
      - name: Sign every member pack and the image-set manifest
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for manifest in release-assets/pack-*.json release-assets/image-set.json; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${manifest}.bundle" \
              "$manifest"
          done
      - name: Verify the signed complete set with authenticated released mvmctl
        env:
          GH_TOKEN: ${{ secrets.IMAGE_CONSUMER_READ_TOKEN || github.token }}
          CONSUMER_TAG: ${{ vars.IMAGE_CONSUMER_TAG }}
          CONSUMER_COMMIT: ${{ vars.IMAGE_CONSUMER_COMMIT }}
          CONSUMER_RUN_ID: ${{ vars.IMAGE_CONSUMER_RUN_ID }}
        run: |
          set -euo pipefail
          # Pins select a real release and its post-publication evidence, not
          # a bypass. Missing pins, evidence, signatures or attestations refuse.
          python3 scripts/verify-released-consumer.py \
            --tag "$CONSUMER_TAG" --commit "$CONSUMER_COMMIT" --run-id "$CONSUMER_RUN_ID" \
            --out "$RUNNER_TEMP/released-consumer"
          "$RUNNER_TEMP/released-consumer/mvmctl" image boot verify --json --require-complete \
            --manifest release-assets/image-set.json \
            --bundle release-assets/image-set.json.bundle \
            --lock release-assets/images.lock \
            --artifacts release-assets
      # The attestation action reads a subject-checksums value that is not a
      # file as inline checksums, so a lost file would attest nothing rather
      # than fail. Checking it against the bytes about to be published first
      # makes a missing, empty or stale list stop the release.
      - name: Check the provenance subjects against the assets to publish
        env:
          SUBJECTS: ${{ steps.assemble.outputs.subjects }}
        run: |
          set -euo pipefail
          test -s "$SUBJECTS"
          (cd release-assets && sha256sum --check --strict --quiet "$SUBJECTS")
          echo "$(wc -l < "$SUBJECTS") provenance subjects match release-assets"
      - name: Attest build provenance for every member and image-set.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.assemble.outputs.subjects }}
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SUBJECTS: ${{ steps.assemble.outputs.subjects }}
        run: |
          set -euo pipefail
          version=${TAG#image-set/}
          # The assembler's subjects are the one member/asset source of truth.
          # Diagnostic workflow artifacts are never published as unowned bytes.
          assets=()
          while read -r digest name; do
            assets+=("release-assets/$name")
            if [[ -f "release-assets/$name.bundle" ]]; then
              assets+=("release-assets/$name.bundle")
            fi
          done < "$SUBJECTS"
          assets+=("release-assets/images.lock")
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "mvm image set ${version}" \
            --generate-notes
