name: Release image set

# A release tag is a request to build a candidate, not permission to publish a
# partial result. The reusable build workflow must finish every architecture
# and role before this job can enter the protected image-release environment.
# Assembly then refuses missing bytes, and mvm's pinned verifier independently
# checks the signed manifest, current-train completeness, lock and artifact
# digests before `gh release create` is allowed to run.
on:
  push:
    tags:
      - image-set/v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: image-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a release commit outside main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::release tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          }
      - name: Download every completed build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Install pinned Nix and cosign
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Resolve the pinned mvm verifier source
        run: |
          set -euo pipefail
          . scripts/mvm-source.sh
          printf 'MVM_SOURCE=%s\n' "$(mvm_source_dir)" >> "$GITHUB_ENV"
          nixpkgs_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          nix profile install "github:NixOS/nixpkgs/${nixpkgs_rev}#cosign"
      - name: Assemble the complete image set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          issued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          scripts/assemble-release.py \
            --artifacts release-assets \
            --tag "$TAG" \
            --source-commit "$source_commit" \
            --issued-at "$issued_at" \
            --mvm-source "$MVM_SOURCE"
      - name: Sign every member pack and the image-set manifest
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for manifest in release-assets/pack-*.json release-assets/image-set.json; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${manifest}.bundle" \
              "$manifest"
          done
      - name: Verify the signed complete set with pinned mvm
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mvm-target"
          cargo build --locked --release --manifest-path "$MVM_SOURCE/Cargo.toml" \
            -p mvmctl --features user
          "$CARGO_TARGET_DIR/release/mvmctl" image boot verify --json --require-complete \
            --manifest release-assets/image-set.json \
            --bundle release-assets/image-set.json.bundle \
            --lock release-assets/images.lock \
            --artifacts release-assets
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#image-set/}
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "mvm image set ${version}" \
            --generate-notes
