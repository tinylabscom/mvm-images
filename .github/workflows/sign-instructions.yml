name: Sign instruction files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/AGENT.md"
      - "**/GEMINI.md"
      - "**/SKILL.md"
      - "**/.claude/**/*.md"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - ".github/workflows/sign-instructions.yml"
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tinylabscom/mvm/.github/actions/sign-instructions@4926fa6a5f3e481c14c9f6d82444309ea1461b1e # mvm PR #4070
